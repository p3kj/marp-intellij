directive.doc.scope.global=Global directive: applies to the whole deck, the last value wins.
directive.doc.scope.frontMatter=Front matter only. The Marp engine itself does not read it.
directive.doc.scope.local=Local directive: applies to this slide and the following ones. Prefix it with <code>_</code> to apply it to this slide only.
