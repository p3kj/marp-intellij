editor.name=Marp Preview

# Settings page
settings.displayName=Marp
settings.themes.group=Themes
settings.themes.add.file=Add CSS File...
settings.themes.add.folder=Add Folder...
settings.themes.add.url=Add URL...
settings.themes.chooseFile.title=Select Marp Theme CSS File
settings.themes.chooseFile.description=A CSS file with a Marp theme (/* @theme name */)
settings.themes.chooseFolder.title=Select Marp Theme Folder
settings.themes.chooseFolder.description=All CSS files inside the folder are loaded as themes
settings.themes.url.title=Add Theme URL
settings.themes.url.prompt=URL of a CSS file (http or https):
settings.themes.url.invalid=Enter a valid http:// or https:// URL
settings.themes.comment=Relative paths are resolved from the project directory. The name from the <code>@theme</code> comment \
  in the CSS is what the <code>theme:</code> directive selects. Example: a file starting with \
  <code>/* @theme sketch */</code> is used with <code>theme: sketch</code> in the slide front matter.
settings.useMarprcThemeSet=Also use themeSet from .marprc.yml
settings.useMarprcThemeSet.comment=Loads the themes from the <code>themeSet</code> option of <code>.marprc.yml</code>, \
  <code>.marprc.yaml</code>, <code>.marprc.json</code> or <code>.marprc</code> in the project root.
settings.rendering.group=Rendering
settings.html=HTML in slides:
settings.html.off=Off
settings.html.default=Default (marp-core allowlist)
settings.html.all=All
settings.html.comment=<b>All</b> renders any raw HTML found in the slides. Scripts in slides never run in the preview. \
  Until the project is trusted, HTML in slides is always off.
settings.math=Math typesetting:
settings.math.mathjax=MathJax
settings.math.katex=KaTeX
settings.math.off=Off
settings.math.comment=The <code>math:</code> directive in the slide front matter takes precedence over this setting.
settings.scrollSync=Synchronize scrolling between editor and preview

