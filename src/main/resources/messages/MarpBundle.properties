settings.themes.comment=Relative paths are resolved from the project directory. The name from the <code>@theme</code> comment \
  in the CSS is what the <code>theme:</code> directive selects. Example: a file starting with \
  <code>/* @theme sketch */</code> is used with <code>theme: sketch</code> in the slide front matter.
settings.useMarprcThemeSet=Also use themeSet from .marprc.yml
settings.useMarprcThemeSet.comment=Same for <code>.marprc.yaml</code>, <code>.marprc.json</code> and <code>.marprc</code>, in the project root.
