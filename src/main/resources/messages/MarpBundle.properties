directive.doc.values=Values
directive.doc.origin=Defined by
directive.doc.origin.marpit=Marpit
directive.doc.origin.core=marp-core
directive.doc.origin.vscode=Marp for VS Code
directive.doc.marp=Marks the file as a Marp deck for Marp for VS Code and this plugin: the preview, the slide structure and the directive support only apply to decks. Only the exact value <code>true</code> counts, with nothing after it on the line.
directive.doc.theme=Theme of the deck: <code>default</code>, <code>gaia</code>, <code>uncover</code> or the name in the <code>@theme</code> comment of a custom theme.
directive.doc.style=CSS that is added to the deck and applies to all slides. For more than a line or two, a <code>&lt;style&gt;</code> block is easier to read.
directive.doc.headingDivider=Starts a new slide before every heading up to the given level, so <code>2</code> divides before <code>#</code> and <code>##</code> headings. Takes a level from 1 to 6, a list of levels such as <code>[1, 3]</code>, or <code>false</code> to turn it off.
directive.doc.lang=Language of the deck, set as the <code>lang</code> attribute of every slide. Example: <code>en</code>.
directive.doc.size=Slide size preset of the theme. The built-in themes have <code>16:9</code> (1280 x 720, default) and <code>4:3</code> (960 x 720).
directive.doc.math=Math library: <code>mathjax</code> (default) or <code>katex</code>.
directive.doc.paginate=Shows the page number: <code>true</code> or <code>false</code>. <code>hold</code> shows it without counting the slide, <code>skip</code> hides it and does not count the slide.
directive.doc.header=Text at the top of the slides. Markdown is allowed, <code>''</code> clears it.
directive.doc.footer=Text at the bottom of the slides. Markdown is allowed, <code>''</code> clears it.
directive.doc.class=HTML class of the slide, which themes use for styling. The built-in themes have <code>lead</code> and <code>invert</code>. Separate several classes with spaces.
directive.doc.backgroundColor=Background color of the slide, any CSS <code>background-color</code> value such as <code>#fff</code>.
directive.doc.backgroundImage=Background image of the slide, a CSS <code>background-image</code> value such as <code>url('bg.png')</code>. The image syntax <code>![bg](bg.png)</code> is usually easier.
directive.doc.backgroundPosition=Position of the background image, a CSS <code>background-position</code> value. Default: <code>center</code>.
directive.doc.backgroundRepeat=Repetition of the background image, a CSS <code>background-repeat</code> value. Default: <code>no-repeat</code>.
directive.doc.backgroundSize=Size of the background image, a CSS <code>background-size</code> value. Default: <code>cover</code>.
directive.doc.color=Text color of the slide, any CSS <code>color</code> value.

# Image syntax
image.completion.type.background=background
image.completion.type.size=size
image.completion.type.filter=filter
image.doc.hint={0}: {1}
image.doc.default=Default
image.doc.origin=Defined by
image.doc.origin.marpit=Marpit
image.doc.bg=Makes the image a slide background. Several <code>bg</code> images on one slide are placed side by side.
image.doc.left=With <code>bg</code>: puts the background on the left and the content beside it. An optional size sets its share of the slide, as in <code>left:40%</code>.
image.doc.right=With <code>bg</code>: puts the background on the right and the content beside it. An optional size sets its share of the slide, as in <code>right:40%</code>.
image.doc.fit=With <code>bg</code>: scales the background to fit the slide without cropping it, same as <code>contain</code>.
image.doc.contain=With <code>bg</code>: scales the background to fit the slide without cropping it.
image.doc.cover=With <code>bg</code>: scales the background to fill the slide, cropping it if needed. This is the default.
image.doc.auto=With <code>bg</code>: keeps the original size of the background.
image.doc.percent=With <code>bg</code>: scales the background by a percentage, as in <code>50%</code>.
image.doc.vertical=With <code>bg</code>: stacks several backgrounds vertically.
image.doc.horizontal=With <code>bg</code>: places several backgrounds side by side. This is the default.
image.doc.w=Width of the image: a number of pixels, a CSS length such as <code>10em</code>, or <code>auto</code>, as in <code>w:400</code>. <code>w</code> is short for <code>width</code>.
image.doc.h=Height of the image: a number of pixels, a CSS length such as <code>10em</code>, or <code>auto</code>, as in <code>h:300</code>. <code>h</code> is short for <code>height</code>.
image.doc.width=Width of the image: a number of pixels, a CSS length such as <code>10em</code>, or <code>auto</code>, as in <code>width:400</code>.
image.doc.height=Height of the image: a number of pixels, a CSS length such as <code>10em</code>, or <code>auto</code>, as in <code>height:300</code>.
image.doc.blur=CSS blur filter. Takes a length, as in <code>blur:5px</code>.
image.doc.brightness=CSS brightness filter. Takes a factor, as in <code>brightness:0.8</code>.
image.doc.contrast=CSS contrast filter. Takes a factor, as in <code>contrast:1.5</code>.
image.doc.drop-shadow=CSS drop shadow filter. Takes the offsets and optionally the blur and the color, as in <code>drop-shadow:0,5px,10px,rgba(0,0,0,.4)</code>.
image.doc.grayscale=CSS grayscale filter. Takes a factor from 0 to 1, as in <code>grayscale:0.5</code>.
image.doc.hue-rotate=CSS hue rotation filter. Takes an angle, as in <code>hue-rotate:90deg</code>.
image.doc.invert=CSS invert filter. Takes a factor from 0 to 1, as in <code>invert:0.5</code>.
image.doc.opacity=CSS opacity filter. Takes a factor from 0 to 1, as in <code>opacity:0.3</code>.
image.doc.saturate=CSS saturation filter. Takes a factor, as in <code>saturate:1.5</code>.
image.doc.sepia=CSS sepia filter. Takes a factor from 0 to 1, as in <code>sepia:0.5</code>.
