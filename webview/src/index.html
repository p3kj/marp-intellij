<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!--
    Deck HTML (settings "HTML in slides: All") must never run script: only the bundled preview script may. Inline
    styles, remote images, stylesheets (Google Fonts, KaTeX) and fonts stay allowed. See docs/ARCHITECTURE.md.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://marp.localhost/app/; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: http: data: blob:; font-src 'self' https: data:; media-src 'self' https: http:; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'self'">
  <title>Marp Preview</title>
  <base href="https://marp.localhost/doc/">
  <link rel="stylesheet" href="https://marp.localhost/app/marp-preview.css">
</head>
<body>
  <div id="marp-root"></div>
  <script src="https://marp.localhost/app/marp-preview.js"></script>
</body>
</html>
